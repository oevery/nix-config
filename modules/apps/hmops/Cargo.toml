[package]
name = "hmops"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rpassword = "7"
rustix = { version = "0.38", features = ["process", "fs"] }
sysinfo = { version = "=0.37.2", default-features = false, features = ["system", "network"] }
