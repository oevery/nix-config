# 追加仓库所需功能，保留安装器已启用的其他功能。
extra-experimental-features = nix-command flakes

# 避免构建意外依赖宿主机上未声明的工具。
sandbox = true

# 让 store 中内容相同的文件共享磁盘空间，不删除旧代。
auto-optimise-store = true

# GC 不因保留构建说明而保留所有产物，但为仍在使用的产物保留构建说明。
keep-outputs = false
keep-derivations = true

# 让二进制替代失败暴露出来，不因此触发意外的本机编译。
fallback = false
